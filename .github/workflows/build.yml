name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licenças do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Testes e APK debug
        env:
          ORG_GRADLE_PROJECT_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --continue --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |^w: .*(deprecat)|What went wrong|FAILED|error:" -A2 build.log | head -60 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=Erros do build::/'; echo
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: StreetPlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK na Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StreetPlay.apk
          gh release delete v1.6.0 --yes --cleanup-tag || true
          gh release create v1.6.0 StreetPlay.apk --title "STREET PLAY 1.6.0" --notes "APK debug instalável para Android TV."
